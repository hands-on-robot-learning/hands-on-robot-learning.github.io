assignments:
  - id: "a1"
    title: "Build, Calibrate, and Teleoperate the SO-101"
    short_title: "Build + Teleop"
    weight: 15
    release_week: 2
    due_week: 3
    summary: "Assemble the SO-101 follower arm, calibrate motors, verify cameras, configure safe motion, and demonstrate basic teleoperation."
    deliverables:
      - "Assembled SO-101 follower arm"
      - "Motor ID and calibration files"
      - "Safe home pose and soft-limit configuration"
      - "Camera detection and preview check"
      - "Short continuous video showing safe teleoperation"
      - "One-page notes file describing known issues, repairs, or deviations"
    grading_emphasis:
      - "Safety"
      - "Correct assembly"
      - "Calibration quality"
      - "Reproducible environment setup"
      - "Honest documentation of issues"

  - id: "a2"
    title: "Handcrafted Cube-Picking Baseline"
    short_title: "Handcrafted Baseline"
    weight: 20
    release_week: 4
    due_week: 6
    summary: "Solve the shared cube pick-and-place benchmark using a non-learned or lightly learned perception-control pipeline before training an end-to-end policy."
    deliverables:
      - "Source code and configuration"
      - "Short technical note explaining the pipeline"
      - "10–20 continuous evaluation trials"
      - "Success rate, completion-time summary, and failure taxonomy"
      - "Representative video showing successes and failures"
    allowed_strategies:
      - "Color segmentation plus centroid estimation"
      - "Overhead camera plus planar homography"
      - "AprilTag or ArUco-assisted calibration or pose debugging"
      - "Wrist-camera visual servoing"
      - "Predefined grid of grasp poses"
      - "Simple object detector or segmenter plus scripted control"
      - "LLM/code-as-policies composition over approved perception and motion primitives"
    grading_emphasis:
      - "Working perception/control decomposition"
      - "Evaluation discipline"
      - "Debugging and failure analysis"
      - "Clarity of code and documentation"

  - id: "a3"
    title: "LeRobot Imitation-Learning Challenge"
    short_title: "Imitation Challenge"
    weight: 30
    release_week: 6
    due_week: 10
    summary: "Collect real robot data, train an ACT or diffusion-policy-style model, deploy it on the SO-101 arm, and evaluate on the official cube pick-and-place benchmark."
    dataset_target:
      baseline: "Approximately 50 valid episodes"
      stronger_attempt: "100+ valid episodes if leader-arm scheduling and hardware reliability permit"
      disclosure: "Teams must disclose whether they used class starter data, their own data, or both."
    deliverables:
      - "Dataset or dataset link"
      - "Dataset card describing cameras, task, episode count, collection protocol, and known issues"
      - "Training configuration and checkpoint"
      - "Evaluation script or command"
      - "10 official evaluation trials"
      - "Short report with success rate, failure taxonomy, and comparison to the handcrafted baseline"
    leaderboard:
      main_metric: "Successes out of 10 official trials"
      tiebreaker: "Median successful completion time"
      awards:
        - "Best data card"
        - "Best failure analysis"
        - "Most robust policy"
        - "Most improved system"
        - "Best low-data policy"
    grading_emphasis:
      - "Dataset quality and documentation"
      - "Correct use of LeRobot"
      - "Policy training and deployment"
      - "Reproducible evaluation"
      - "Thoughtful comparison to the handcrafted baseline"

  - id: "a4"
    title: "VLA / SmolVLA Deployment and Final Demo"
    short_title: "VLA Final Demo"
    weight: 25
    release_week: 10
    due_week: 15
    summary: "Deploy or adapt a VLA-style model such as SmolVLA on a physical SO-101 manipulation task and characterize its behavior."
    possible_tracks:
      - "Base-model deployment"
      - "Small-data finetuning or adaptation"
      - "VLA vs. task-specific policy comparison"
      - "New manipulation task"
      - "Camera or sensor ablation"
    deliverables:
      - "Task proposal and safety check"
      - "Dataset or evaluation setup description"
      - "Model/configuration used"
      - "Final demo video"
      - "Short report with qualitative and quantitative evaluation"
      - "Failure analysis and comparison to Assignment 3 where applicable"
    grading_emphasis:
      - "Sensible task design"
      - "Correct model/setup usage"
      - "Honest characterization of VLA behavior"
      - "Good experimental controls"
      - "Final demo quality and report clarity"

participation:
  weight: 10
  title: "Participation, paper lightning talk, peer evaluation, and engineering citizenship"
  examples:
    - "Short paper or system lightning presentation"
    - "Useful questions and discussion"
    - "Responsible shared-hardware usage"
    - "Helpful bug reports or documentation contributions"
    - "Peer support that does not cross into inappropriate solution-sharing"
    - "Mid-semester and final peer evaluations"
