weeks:
  - week: 1
    dates: "Aug 31–Sep 4"
    theme: "Course launch and robot learning systems"
    lecture_title: "What is robot learning, and why do robots fail in surprising ways?"
    robot_mystery: "The robot confidently reaches for the cube and misses. Is the problem perception, calibration, control, or the policy?"
    core_topics:
      - "Modern robot learning overview"
      - "The data-driven robotics lifecycle"
      - "Hardware, sensing, teleoperation, datasets, policies, deployment, and evaluation"
      - "Course expectations and team survey"
    lab_focus: "Course setup, team survey, hardware preview"
    milestone: "Team survey released"

  - week: 2
    dates: "Sep 8–Sep 11"
    theme: "Robotics essentials and safety"
    lecture_title: "Frames, kinematics, controllers, and safety"
    robot_mystery: "The target point is correct in the image, but the robot moves in the wrong direction."
    core_topics:
      - "Rigid transforms and coordinate frames"
      - "Forward and inverse kinematics recap"
      - "Joint-space vs. end-effector control"
      - "Velocity limits, safe home poses, and soft limits"
      - "LeRobot setup"
    lab_focus: "Software setup and assembly preparation"
    milestone: "Assignment 1 released"
    note: "Labor Day is Sep 7; adjust if the class block is scheduled on Monday."

  - week: 3
    dates: "Sep 14–Sep 18"
    theme: "SO-101 assembly and calibration"
    lecture_title: "Wake the robot"
    robot_mystery: "The arm moves, but one joint moves backward or saturates early."
    core_topics:
      - "SO-101 assembly"
      - "Motor IDs and calibration"
      - "Camera detection"
      - "Safe teleoperation smoke tests"
    lab_focus: "In-class build, calibration, and teleop"
    milestone: "Assignment 1 due"

  - week: 4
    dates: "Sep 21–Sep 25"
    theme: "Teleoperation, cameras, and data"
    lecture_title: "What makes a demonstration useful?"
    robot_mystery: "Human teleoperation looks successful, but the resulting dataset trains a bad policy."
    core_topics:
      - "Leader-follower teleoperation"
      - "Keyboard/gamepad teleoperation"
      - "Fixed camera vs. wrist camera"
      - "LeRobot dataset structure"
      - "What counts as a valid episode"
    lab_focus: "Teleop practice and camera verification"
    milestone: "Assignment 2 released"

  - week: 5
    dates: "Sep 28–Oct 2"
    theme: "Handcrafted cube picking"
    lecture_title: "Before learning: can we solve the task by engineering?"
    robot_mystery: "The cube detector works for five minutes and then fails when the lighting changes."
    core_topics:
      - "Color segmentation"
      - "Centroid estimation"
      - "Planar homographies"
      - "AprilTag/ArUco debugging targets"
      - "Scripted pick-and-place primitives"
      - "Visual servoing"
    lab_focus: "Handcrafted baseline development"
    milestone: "Assignment 2 check-in"

  - week: 6
    dates: "Oct 5–Oct 9"
    theme: "Code-as-policies and imitation learning"
    lecture_title: "From motion primitives to behavior cloning"
    robot_mystery: "An LLM writes plausible robot code, but the robot still fails."
    core_topics:
      - "Code-as-policies framing"
      - "Behavior cloning"
      - "Covariate shift"
      - "Compounding error"
      - "Why demonstration distributions matter"
    lab_focus: "Baseline evaluation and imitation-learning setup"
    milestone: "Assignment 2 due; Assignment 3 released"

  - week: 7
    dates: "Oct 12–Oct 16"
    theme: "Action chunking and dataset quality"
    lecture_title: "Teaching a robot from demonstrations"
    robot_mystery: "The policy starts correctly, then drifts into an unrecoverable state."
    core_topics:
      - "Action chunking"
      - "ACT architecture"
      - "Episode diversity"
      - "Dataset cards"
      - "Train/validation splits for real robot data"
    lab_focus: "Dataset collection and first training run"
    milestone: "Assignment 3 dataset-v0 check-in"

  - week: 8
    dates: "Oct 19–Oct 23"
    theme: "Diffusion policies and fall-break-safe debugging"
    lecture_title: "Generative policies for robot actions"
    robot_mystery: "The diffusion policy hesitates near the cube or oscillates between actions."
    core_topics:
      - "Diffusion-policy intuition"
      - "Action distributions"
      - "Temporal consistency"
      - "Debugging training runs"
    lab_focus: "Reduced training run and debugging clinic"
    milestone: "Training dry run"
    note: "Fall break is Oct 22–23; avoid major deadlines this week."

  - week: 9
    dates: "Oct 26–Oct 30"
    theme: "Deployment stack and evaluation"
    lecture_title: "Why trained policies fail on real robots"
    robot_mystery: "The validation loss looks good, but the deployed robot fails immediately."
    core_topics:
      - "Latency"
      - "Action frequency"
      - "Chunk size"
      - "Controller mismatch"
      - "Camera mismatch"
      - "Evaluation protocol"
    lab_focus: "Leaderboard dry run"
    milestone: "Assignment 3 leaderboard dry run"

  - week: 10
    dates: "Nov 2–Nov 6"
    theme: "Official imitation-learning challenge"
    lecture_title: "What does it mean to evaluate a robot policy fairly?"
    robot_mystery: "A great demo video gets a poor official evaluation score."
    core_topics:
      - "Continuous-video evaluation"
      - "Trial definitions"
      - "Failure taxonomies"
      - "Data leakage and cherry-picking"
    lab_focus: "Official cube pick-and-place evaluation"
    milestone: "Assignment 3 due; Assignment 4 released"

  - week: 11
    dates: "Nov 9–Nov 13"
    theme: "Vision-language-action models"
    lecture_title: "Giving the robot language"
    robot_mystery: "The VLA appears to understand the instruction but executes the wrong physical behavior."
    core_topics:
      - "From LLMs to VLMs to VLAs"
      - "VLA observations: cameras, robot state, and language"
      - "SmolVLA-style workflows"
      - "Base model deployment vs. finetuning"
      - "VLA failure modes"
    lab_focus: "Assignment 4 proposal and setup"
    milestone: "Assignment 4 proposal due"

  - week: 12
    dates: "Nov 16–Nov 20"
    theme: "VLA adaptation and research systems"
    lecture_title: "How much robot data does a generalist policy need?"
    robot_mystery: "Adding more demonstrations makes the model worse."
    core_topics:
      - "VLA finetuning"
      - "Multi-camera observations"
      - "Task design"
      - "Model and dataset cards"
      - "Research paper dissection"
    lab_focus: "VLA dataset/model checkpoint"
    milestone: "Assignment 4 dataset/model checkpoint"

  - week: 13
    dates: "Nov 23–Nov 27"
    theme: "Fall recess"
    lecture_title: "No required class meeting"
    robot_mystery: "Optional: post a failure clip and a debugging hypothesis."
    core_topics:
      - "No major deadline"
      - "Optional asynchronous debugging"
      - "Optional office-hour check-ins"
    lab_focus: "Optional team debugging"
    milestone: "No required deadline"
    note: "Fall recess is Nov 23–27."

  - week: 14
    dates: "Nov 30–Dec 4"
    theme: "Evaluation, ablations, and demo polish"
    lecture_title: "How to make a robot demo honest"
    robot_mystery: "The robot works only when one team member stands next to it."
    core_topics:
      - "Ablations"
      - "Robustness checks"
      - "Final demo design"
      - "Failure analysis"
      - "Guest lecture or paper dissection"
    lab_focus: "Final demo dry run"
    milestone: "Assignment 4 demo dry run"

  - week: 15
    dates: "Dec 7–Dec 11"
    theme: "Final demo week"
    lecture_title: "Course showcase"
    robot_mystery: "Final boss: can the robot work when it counts?"
    core_topics:
      - "Final demos"
      - "Peer feedback"
      - "Course reflection"
      - "What to build next"
    lab_focus: "Final demos and showcase"
    milestone: "Assignment 4 due by Dec 11"
